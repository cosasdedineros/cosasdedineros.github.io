*{

}

.topbar{

  top:0;
  z-index:1000;

  padding:10px 20px;

.topbar a{

}

  font-size:14px;
}

nav a:hover{

}

/* HERO */

  padding:70px 20px;
  text-align:center;
  background:var(--verde);
  color:white;
}

.hero h1{

/* CONTENIDO */

/* FOOTER */
