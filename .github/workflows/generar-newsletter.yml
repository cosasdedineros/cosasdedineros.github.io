
name: Generar newsletter financiera

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install requests trafilatura beautifulsoup4 google-genai

      - name: Generar newsletter con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generar_newsletter.py

      - name: Publicar newsletter en la web
        run: |
          cp borrador_newsletter.html newsletter.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter.html noticias_publicadas.json
          git diff --cached --quiet || git commit -m "Actualizar newsletter"
          git push

      - name: Guardar borrador
        uses: actions/upload-artifact@v4
        with:
          name: borrador-newsletter
          path: |
            borrador_newsletter.html
            resultado_newsletter.json
          if-no-files-found: error
