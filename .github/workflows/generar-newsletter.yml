}}
</style>
</head>
<body>
<header>
    <h1>CosasDeDineros</h1>
    <p>Las noticias financieras explicadas sin complicaciones.</p>
    <p>{fecha_texto} · Lectura aproximada: 5 minutos</p>
</header>
{contenido_html}
<footer>
    <p>Un proyecto de CosasDeDineros.</p>
</footer>
