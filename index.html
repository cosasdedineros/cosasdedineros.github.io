<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cosas de Dineros portada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EE}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
</style>
</helmet>

<div style="--accent: {{accent}}; background: #F6F4EE; color: #14211D; font-family: 'Inter', system-ui, sans-serif; font-size: 17px; line-height: 1.6; width: 100%; box-sizing: border-box">

  <!-- HEADER -->
  <header style="border-bottom: 1px solid #DAD6C9; background: #F6F4EE">
    <div style="max-width: 1200px; margin: 0 auto; padding: 16px 32px 0; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
      <a href="https://cosasdedineros.github.io/index.html" style="display: flex; align-items: center; gap: 12px">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--accent)"/><path d="M9 28 L16 20 L22 24 L31 12" fill="none" stroke="#F6F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="12" r="3" fill="#F2B84B"/></svg>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">Cosas de Dineros</span>
      </a>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px">
        <a href="https://mail.google.com/mail/?view=cm&amp;to=cosasdedinerosresponde@gmail.com&amp;su=Mensaje%20desde%20la%20web&amp;body=Hola%2C%20te%20escribo%20desde%20Cosas%20de%20Dineros" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1.5px solid #14211D; border-radius: 999px; font-weight: 600; font-size: 15px">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7 L12 13 L20 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Mensaje directo
        </a>
        <sc-if value="{{ sesionIniciada }}" hint-placeholder-val="{{ false }}">
          <button type="button" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 1.5px solid #14211D; border-radius: 999px; background: transparent; color: #14211D; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer">Salir</button>
        </sc-if>
        <sc-if value="{{ sesionCerrada }}" hint-placeholder-val="{{ true }}">
          <button type="button" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer">Iniciar sesión</button>
        </sc-if>
      </div>
    </div>
    <nav aria-label="Principal" style="max-width: 1200px; margin: 0 auto; padding: 6px 32px 0; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px; font-size: 16px; font-weight: 500">
